# Plan morning-digest § 3 and § 4. Saves /digest/2026-10-28 as one HTML file and deploys it to
# GitHub Pages as an artifact, so the preview never lands in the repo (ADR 0003). Run it again
# with an empty marker to upload the clean copy over the same link.
name: preview

on:
  workflow_dispatch:
    inputs:
      marker:
        description: LANE_MARKER for the banner. Leave empty for the clean copy.
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Save /digest/2026-10-28 as one HTML file
        env:
          LANE_MARKER: ${{ inputs.marker }}
          PORT: '8787'
        run: |
          npx tsx src/server.ts &
          for i in $(seq 1 30); do curl -sf localhost:8787/health >/dev/null && break; sleep 1; done
          mkdir -p _site
          curl -sf localhost:8787/digest/2026-10-28 -o _site/index.html
          kill %1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
